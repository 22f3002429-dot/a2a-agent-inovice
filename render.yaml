services:
  - type: web
    name: a2a-invoice-agent
    runtime: node
    plan: free
    buildCommand: echo "no build"
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: PUBLIC_BASE_URL
        sync: false
